[uwsgi]
# Django-related settings
project = ocsinventory_backend
base = /usr/share/ocsinventory-backend
chdir = /usr/share/ocsinventory-backend
plugins = python3

# Django's wsgi file
module = ocsinventory_backend.wsgi:application

# process-related settings
master = true
processes = 5

# the socket (use the full path to avoid any problems)
socket = /var/run/ocsinventory-backend/ocsinventory-backend.sock
chmod-socket = 666
vacuum = true

# Log settings
logto = /var/log/ocsinventory-backend/ocsinventory-backend.log

emperor-pidfile = /var/run/uwsgi/ocsinventory-backend.pid
deamonize = /var/log/ocsinventory-backend.log