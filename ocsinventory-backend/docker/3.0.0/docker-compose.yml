version: '3.8'

services:
  ocsinventory-backend:
    build: .
    container_name: ocsinventory-backend
    restart: always
    volumes:
      - ocsinventory-backend:/opt/ocsinventory-backend
    expose:
      - "8000"
    networks:
      - ocsinventory-network

  ocsproxy:
    image: nginx
    container_name: ocsinventory-proxy
    restart: always
    volumes:
      - ./files/nginx/ocsinventory-backend.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "80:80"
    depends_on:
      - ocsinventory-backend
    networks:
      - ocsinventory-network

networks:
  ocsinventory-network:

volumes:
  ocsinventory-backend:
