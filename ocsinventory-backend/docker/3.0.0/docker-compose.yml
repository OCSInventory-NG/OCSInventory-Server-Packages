version: '3.8'

services:
  ocsinventory-backend:
    image: ocsinventoryserver-backend:3.0.0
    container_name: ocsinventory-backend
    restart: always
    volumes:
      - ocsinventory-backend:/app
      - ocsinventory-backend-socket:/var/run/ocsinventory-backend
    expose:
      - "8000"
    networks:
      - ocsinventory-network

  ocsproxy:
    image: nginx
    container_name: ocsinventory-proxy
    restart: always
    volumes:
      - ./files/nginx/ocsinventory-backend.conf:/etc/nginx/conf.d/default.conf
      - ocsinventory-backend-socket:/var/run/ocsinventory-backend
    ports:
      - "80:80"
    depends_on:
      - ocsinventory-backend
    networks:
      - ocsinventory-network

  ocsdb:
    image: postgres:12
    container_name: ocsinventory-db
    restart: always
    environment:
      POSTGRES_USER: ocsuser
      POSTGRES_PASSWORD: ocsuser
      POSTGRES_DB: ocsdb
    volumes:
      - ocsinventory-db:/var/lib/postgresql/data

networks:
  ocsinventory-network:

volumes:
  ocsinventory-backend:
  ocsinventory-backend-socket:
  ocsinventory-db: