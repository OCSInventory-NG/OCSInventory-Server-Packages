[uwsgi]
project = ocsinventory_backend
base = /usr/share/ocsinventory-backend
chdir = /usr/share/ocsinventory-backend

home = /usr/lib/ocsinventory-backend/venv
module = ocsinventory_backend.wsgi:application

master = true
processes = 5
harakiri = 300
max-requests = 1000

socket = /var/run/ocsinventory-backend/ocsinventory-backend.sock
chmod-socket = 660
chown-socket = ocsbackend:nginx
vacuum = true

die-on-term = true
logto = /var/log/ocsinventory-backend/ocsinventory-backend.log
log-4xx = true
log-5xx = true