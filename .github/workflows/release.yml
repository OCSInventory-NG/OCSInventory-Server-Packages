name: Release

# Fires on any tag looking like a version (3.0.0, 3.1.0-rc1, ...).
# "ocsinventory-release" (the YUM repo/GPG-key package) is intentionally
# excluded from this pipeline: it has its own, independent lifecycle
# (see REDHAT.md), so it is never touched by scripts/generate-release.sh.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write
  pull-requests: write

env:
  VERSION: ${{ github.ref_name }}

jobs:
  # ---------------------------------------------------------------------
  # 1. Materialize docker/<version>/, bump debian/changelog and rpm specs,
  #    and open a PR so the generated files stay reviewable and versioned
  #    in git history (same convention as today's manual releases).
  # ---------------------------------------------------------------------
  generate:
    runs-on: ubuntu-latest
    outputs:
      branch: release/${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Install devscripts (dch)
        run: sudo apt-get update && sudo apt-get install -y devscripts

      - name: Generate versioned packaging files
        env:
          DEBFULLNAME: OCS Inventory Release Bot
          DEBEMAIL: ci@ocsinventory-ng.org
        run: ./scripts/generate-release.sh "${VERSION}"

      - name: Open pull request with the generated files
        uses: peter-evans/create-pull-request@v6
        with:
          base: main
          branch: release/${{ env.VERSION }}
          title: "release: scaffold packaging for ${{ env.VERSION }}"
          commit-message: "release: scaffold docker/deb/rpm for ${{ env.VERSION }}"
          labels: release-automation
          body: |
            Auto-generated by [release.yml](.github/workflows/release.yml) for tag `${{ env.VERSION }}`.

            - `docker/${{ env.VERSION }}/` created for backend, frontend and server
            - `debian/changelog` bumped for backend, frontend, agent and server
            - rpm `.spec` `%define version`/`%define release` and `%changelog` bumped

            The build/publish jobs of this same workflow run build the packages from
            this branch and attach them to the GitHub Release for `${{ env.VERSION }}`
            regardless of whether this PR has been merged yet. Merge this PR to keep
            these generated files in the default branch's history.

  # ---------------------------------------------------------------------
  # 2. Build .deb for each component, from the branch generate() just created.
  # ---------------------------------------------------------------------
  build-deb:
    needs: generate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend, agent, server]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.generate.outputs.branch }}

      - name: Resolve upstream source repo
        id: source
        run: |
          case "${{ matrix.component }}" in
            backend)  echo "repo=gillesdubois/OCSInventory-Server-Backend-Rework" >> "$GITHUB_OUTPUT" ;;
            frontend) echo "repo=gillesdubois/OCSInventory-Server-Frontend-Rework" >> "$GITHUB_OUTPUT" ;;
            agent)
              # Unlike backend/frontend, the agent isn't repackaged from a
              # GitHub release tarball: rpm-v3.ocsinventory-ng.org and
              # deb-v3.ocsinventory-ng.org (configured by ocsinventory-release)
              # are this pipeline's *publish destinations*, not a source.
              # Building the ocsinventory-cli (dart) binary + install/uninstall
              # scripts for Linux is currently a manual step with no
              # automated source yet, so this job intentionally keeps
              # skipping with a warning until that process is defined.
              echo "repo=" >> "$GITHUB_OUTPUT" ;;
            server)   echo "repo=" >> "$GITHUB_OUTPUT" ;; # meta-package, no upstream source
          esac

      - name: Fetch upstream release tarball
        if: steps.source.outputs.repo != ''
        run: |
          set -euo pipefail
          pkg="ocsinventory-${{ matrix.component }}"
          url="https://github.com/${{ steps.source.outputs.repo }}/releases/download/${VERSION}/${pkg}-${VERSION}.tar.gz"
          echo "fetching $url"
          curl -fsSL "$url" -o "/tmp/${pkg}.tar.gz"
          mkdir -p "${pkg}/deb/${pkg}/usr/share"
          tar -xzf "/tmp/${pkg}.tar.gz" -C "${pkg}/deb/${pkg}/usr/share"

      - name: Skip (no resolved upstream repo for this component)
        if: steps.source.outputs.repo == '' && matrix.component != 'server'
        run: |
          echo "::warning::no upstream repo configured for ${{ matrix.component }}, skipping .deb build"

      - name: Install build dependencies
        if: steps.source.outputs.repo != '' || matrix.component == 'server'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential devscripts debhelper dh-python dpkg-dev python3-all python3-setuptools

      - name: Build .deb
        if: steps.source.outputs.repo != '' || matrix.component == 'server'
        run: |
          pkg="ocsinventory-${{ matrix.component }}"
          cd "${pkg}/deb/${pkg}"
          dpkg-buildpackage -b -us -uc

      - name: Upload .deb artifact
        if: steps.source.outputs.repo != '' || matrix.component == 'server'
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.component }}
          path: |
            ocsinventory-*/deb/*.deb
            ocsinventory-*/deb/*.changes

  # ---------------------------------------------------------------------
  # 3. Build .rpm for each component, using mock for a clean chroot build.
  # ---------------------------------------------------------------------
  build-rpm:
    needs: generate
    runs-on: ubuntu-latest
    container: fedora:latest
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend, agent, server]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.generate.outputs.branch }}

      - name: Resolve upstream source repo
        id: source
        run: |
          case "${{ matrix.component }}" in
            backend)  echo "repo=gillesdubois/OCSInventory-Server-Backend-Rework" >> "$GITHUB_OUTPUT" ;;
            frontend) echo "repo=gillesdubois/OCSInventory-Server-Frontend-Rework" >> "$GITHUB_OUTPUT" ;;
            agent)    echo "repo=" >> "$GITHUB_OUTPUT" ;; # TODO: see build-deb
            server)   echo "repo=" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Install rpm build tooling
        if: steps.source.outputs.repo != '' || matrix.component == 'server'
        run: dnf install -y rpm-build rpmdevtools gcc make redhat-rpm-config curl

      - name: Fetch upstream release tarball into rpm sources
        if: steps.source.outputs.repo != ''
        run: |
          set -euo pipefail
          pkg="ocsinventory-${{ matrix.component }}"
          rpm_version="${VERSION/-/\~}"
          url="https://github.com/${{ steps.source.outputs.repo }}/releases/download/${VERSION}/${pkg}-${VERSION}.tar.gz"
          echo "fetching $url"
          curl -fsSL "$url" -o "${pkg}/rpm/sources/${pkg}-${rpm_version}.tar.gz"

      - name: Build .rpm
        if: steps.source.outputs.repo != '' || matrix.component == 'server'
        run: |
          set -euo pipefail
          pkg="ocsinventory-${{ matrix.component }}"
          rpmdev-setuptree
          cp -f "${pkg}"/rpm/sources/* ~/rpmbuild/SOURCES/ 2>/dev/null || true
          cp -f "${pkg}/rpm/specs/${pkg}.spec" ~/rpmbuild/SPECS/
          rpmbuild -bb ~/rpmbuild/SPECS/"${pkg}".spec

      - name: Upload .rpm artifact
        if: steps.source.outputs.repo != '' || matrix.component == 'server'
        uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.component }}
          path: /github/home/rpmbuild/RPMS/**/*.rpm

  # ---------------------------------------------------------------------
  # 4. Build & tag the docker images (no push to a registry yet — see the
  #    "publish" job for how the image tarballs reach the GitHub Release).
  #    "server" has no Dockerfile of its own: its docker/<version>/ only
  #    holds a docker-compose.yml that references the backend/frontend
  #    images, so there is nothing to build here for it.
  # ---------------------------------------------------------------------
  build-docker:
    needs: generate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.generate.outputs.branch }}

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        run: |
          pkg="ocsinventory-${{ matrix.component }}"
          docker buildx build --pull --load \
            -f "${pkg}/docker/${VERSION}/Dockerfile" \
            -t "ocsinventory/${pkg}:${VERSION}" \
            "${pkg}/docker/${VERSION}"

      - name: Save image as an artifact
        run: |
          pkg="ocsinventory-${{ matrix.component }}"
          docker save "ocsinventory/${pkg}:${VERSION}" | gzip > "${pkg}-${VERSION}-docker.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: docker-${{ matrix.component }}
          path: "*-docker.tar.gz"

  # ---------------------------------------------------------------------
  # 5. Publish everything to the GitHub Release for this tag.
  # ---------------------------------------------------------------------
  publish:
    needs: [build-deb, build-rpm, build-docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifact layout
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*-docker.tar.gz' \) \
            -exec cp -f {} release-assets/ \;
          ls -la release-assets

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: ${{ env.VERSION }}
          prerelease: ${{ contains(env.VERSION, '-') }}
          files: release-assets/*
          body: |
            Packages built automatically from tag `${{ env.VERSION }}`.
            See the companion PR for the generated docker/deb/rpm packaging files.

            Packages are **unsigned** in this release (GPG signing is not wired
            into the pipeline yet).
