# Dev stack: builds the backend and frontend images from a given branch, tag
# or commit SHA of their respective repositories (see ../../ocsinventory-backend/
# docker/dev/Dockerfile and ../../ocsinventory-frontend/docker/dev/Dockerfile),
# instead of pulling a published release image - backed by MySQL.
#
# Usage:
#   BACKEND_REF=my-backend-branch FRONTEND_REF=my-frontend-branch \
#     docker compose -f ocsinventory-server/docker/dev/docker-compose.mysql.yml up -d --build
name: ocsinventory-dev-mysql

services:
  ocsinventory-backend:
    build:
      context: ../../../ocsinventory-backend/docker/dev
      args:
        BACKEND_REPO: ${BACKEND_REPO:-https://github.com/OCSInventory-NG/OCSInventory-Server-Backend-Rework.git}
        BACKEND_REF: ${BACKEND_REF:-dev}
    image: ocsinventory/ocsinventory-backend:dev
    container_name: ocsinventory-backend-dev
    restart: always
    environment:
      DEBUG_ENV: "False"
      FRONTEND_REDIRECT_ENV: "http://localhost:${DEV_FRONTEND_PORT:-8081}"
      DB_ENGINE_ENV: "django.db.backends.mysql"
      # CHANGE ME IN PRODUCTION (must match ocsinventory-db's MYSQL_*) - this
      # stack is for dev/CI use only, never for production.
      DB_NAME_ENV: "ocsdb"
      DB_USER_ENV: "ocsuser"
      DB_PASSWORD_ENV: "ocsuser"
      DB_HOST_ENV: "ocsinventory-db"
      DB_PORT_ENV: "3306"
    volumes:
      - ocsinventory-backend-socket:/var/run/ocsinventory-backend
    links:
      - ocsinventory-db
    depends_on:
      ocsinventory-db:
        condition: service_healthy
    expose:
      - 8000
    networks:
      - ocsinventory-network

  ocsinventory-proxy:
    image: nginx
    container_name: ocsinventory-proxy-dev
    restart: always
    volumes:
      - ../../../ocsinventory-backend/docker/dev/files/nginx/ocsinventory-backend.conf:/etc/nginx/conf.d/default.conf
      - ocsinventory-backend-socket:/var/run/ocsinventory-backend
    ports:
      - ${DEV_HTTP_PORT:-8880}:80
      - ${DEV_HTTPS_PORT:-8843}:443
    depends_on:
      - ocsinventory-backend
    networks:
      - ocsinventory-network

  ocsinventory-db:
    image: mysql:8.4
    container_name: ocsinventory-db-dev
    restart: always
    environment:
      # CHANGE ME IN PRODUCTION
      MYSQL_DATABASE: ocsdb
      MYSQL_USER: ocsuser
      MYSQL_PASSWORD: ocsuser
      MYSQL_ROOT_PASSWORD: ocsroot
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "ocsuser", "-pocsuser"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ocsinventory-db:/var/lib/mysql
    networks:
      - ocsinventory-network

  ocsinventory-frontend:
    build:
      context: ../../../ocsinventory-frontend/docker/dev
      args:
        FRONTEND_REPO: ${FRONTEND_REPO:-https://github.com/OCSInventory-NG/OCSInventory-Server-Frontend-Rework.git}
        FRONTEND_REF: ${FRONTEND_REF:-dev}
    image: ocsinventory/ocsinventory-frontend:dev
    container_name: ocsinventory-frontend-dev
    restart: always
    environment:
      BACKEND_API_ROUTE_ENV: "http://localhost:${DEV_HTTP_PORT:-8880}/"
    ports:
      - "${DEV_FRONTEND_PORT:-8081}:80"
    volumes:
      - ocsinventory-frontend-config:/usr/share/ocsinventory-frontend/config
      - ocsinventory-frontend-extensions:/usr/share/ocsinventory-frontend/extensions
    networks:
      - ocsinventory-network

networks:
  ocsinventory-network:

volumes:
  ocsinventory-backend-socket:
  ocsinventory-db:
  ocsinventory-frontend-config:
  ocsinventory-frontend-extensions:
