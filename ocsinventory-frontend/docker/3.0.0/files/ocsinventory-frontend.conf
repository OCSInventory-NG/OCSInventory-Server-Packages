<VirtualHost *:80>
    DocumentRoot /usr/share/ocsinventory-frontend

    ErrorLog /var/log/ocsinventory-frontend/error.log
    CustomLog /var/log/ocsinventory-frontend/access.log combined

    <Directory /usr/share/ocsinventory-frontend>
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>